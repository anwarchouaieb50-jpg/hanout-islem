
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#15803d">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b45">
  <title>Hanout Anwar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6f3;
      margin: 0;
      color: #222;
    }
    header {
      background: #176b45;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }
    main {
      max-width: 700px;
      margin: 20px auto;
      padding: 16px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 10px #00000012;
      margin-bottom: 16px;
    }
    h2 { margin-top: 0; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #176b45;
      color: white;
      border: 0;
      cursor: pointer;
    }
    .muted { color: #666; line-height: 1.7; }
    #status { font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>🏪 Hanout Anwar</h1>
    <p>إدارة الحانوت متاعك</p>
  </header>

  <main>
    <section class="card">
      <h2>📦 المنتوجات والستوك</h2>
      <p class="muted">نسجّلوا المنتوجات على الجهاز، حتى وقت اللي الإنترنت مقطوع.</p>
      <input id="productName" placeholder="اسم المنتوج">
      <input id="productQty" type="number" min="0" step="1" placeholder="الكمية">
      <input id="productPrice" type="number" min="0" step="0.001" placeholder="سعر البيع بالدينار">
      <button onclick="addProduct()">إضافة منتوج</button>
      <div id="products"></div>
    </section>

    <section class="card">
      <h2>📶 حالة الاتصال</h2>
      <p id="status"></p>
      <p class="muted">هذه نسخة أولية للتجربة. المزامنة مع قاعدة البيانات لم تُفعّل بعد.</p>
    </section>
  </main>

  <script>
    const storageKey = "hanoutAnwarProducts";

    function loadProducts() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || "[]");
      } catch {
        return [];
      }
    }

    function renderProducts() {
      const list = loadProducts();
      const container = document.getElementById("products");

      if (!list.length) {
        container.innerHTML = '<p class="muted">ما زلنا ما أضفنا حتى منتوج.</p>';
        return;
      }

      container.innerHTML = "";
      list.forEach(product => {
        const item = document.createElement("div");
        item.className = "card";

        const name = document.createElement("strong");
        name.textContent = product.name;

        const details = document.createElement("p");
        details.textContent =
          "الكمية: " + product.qty +
          " | سعر البيع: " + product.price.toFixed(3) + " د.ت";

        item.append(name, details);
        container.appendChild(item);
      });
    }

    function addProduct() {
      const name = document.getElementById("productName").value.trim();
      const qty = Number(document.getElementById("productQty").value);
      const price = Number(document.getElementById("productPrice").value);

      if (!name ||
          document.getElementById("productQty").value === "" ||
          document.getElementById("productPrice").value === "" ||
          !Number.isInteger(qty) || qty < 0 ||
          !Number.isFinite(price) || price < 0) {
        alert("ثبّت اسم المنتوج والكمية والسعر.");
        return;
      }

      const list = loadProducts();
      list.push({ id: Date.now(), name, qty, price });
      localStorage.setItem(storageKey, JSON.stringify(list));

      document.getElementById("productName").value = "";
      document.getElementById("productQty").value = "";
      document.getElementById("productPrice").value = "";

      renderProducts();
    }

    function updateStatus() {
      document.getElementById("status").textContent =
        navigator.onLine ? "🟢 متصل بالإنترنت" : "🟠 بلا إنترنت";
    }

    window.addEventListener("online", updateStatus);
    window.addEventListener("offline", updateStatus);

    updateStatus();
    renderProducts();
  </script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch((error) => console.error("Service worker error:", error));
  });
}
</script>
</body>
</html>
